<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NoteOn - Gravação e Captura</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 300px;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #818cf8;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-connected {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-disconnected {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-audio {
      width: 100%;
      padding: 11px 12px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
    }
    .btn-audio:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
    }
    .btn-audio-active {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4) !important;
    }
    .btn-primary {
      width: 100%;
      padding: 10px 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.15s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
    }
    .btn-secondary {
      width: 100%;
      padding: 9px 11px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .kbd {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #475569;
      font-family: monospace;
      font-size: 10px;
      font-weight: 700;
      color: #a5b4fc;
    }
    .divider {
      height: 1px;
      background: #1e293b;
      margin: 4px 0;
    }
    .toast-msg {
      margin-top: 10px;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .toast-success {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>🎓 NoteOn Extensão</span>
    </div>
    <div id="statusBadge" class="status-badge status-disconnected">
      ● Verificando...
    </div>
  </div>

  <p class="desc">
    Grave o áudio da aula com botão flutuante e recorte slides da tela diretamente para o seu caderno.
  </p>

  <div class="btn-group">
    <!-- NOVO: Gravar Áudio da Aula com botão flutuante -->
    <button id="btnRecordAudio" class="btn-audio">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="font-size: 14px;">🎙️</span>
        <span id="recordAudioLabel">Gravar Áudio da Aula</span>
      </div>
      <span class="kbd">Alt + R</span>
    </button>

    <div class="divider"></div>

    <button id="btnSnipArea" class="btn-primary">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span>📐</span>
        <span>Marcar Área (Recorte)</span>
      </div>
      <span class="kbd">Alt + S</span>
    </button>

    <button id="btnCaptureFull" class="btn-secondary">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span>🖥️</span>
        <span>Print da Tela Inteira</span>
      </div>
      <span class="kbd">Alt + Shift + S</span>
    </button>
  </div>

  <div id="toast" class="toast-msg toast-success">
    ✓ Comando enviado!
  </div>

  <script src="popup.js"></script>
</body>
</html>
